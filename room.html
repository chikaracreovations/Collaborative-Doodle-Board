<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Collaborative Whiteboard | DoodleBoard</title>
  <meta name="description" content="Live multi-user collaborative canvas room powered by WebSockets and HTML5 Canvas.">
  
  <!-- Fonts & Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Modular Stylesheet -->
  <link rel="stylesheet" href="css/whiteboard.css">
</head>
<body>

  <!-- Floating Whiteboard Toolbar -->
  <div id="toolbar">
    <div class="tool-group">
      <a href="index.html" class="home-link" title="Return to Dashboard" aria-label="Return home">
        <i class="fas fa-home"></i>
      </a>

      <input type="color" id="colorPicker" value="#0ea5e9" title="Brush Color">
      <input type="range" id="sizePicker" min="1" max="30" value="3" title="Brush Size">
      
      <button id="eraserBtn" class="tool-button" title="Eraser Tool">
        <i class="fas fa-eraser"></i>
      </button>

      <button id="undoBtn" class="tool-button" disabled title="Undo (Ctrl+Z)">
        <i class="fas fa-undo"></i>
      </button>

      <button id="redoBtn" class="tool-button" disabled title="Redo (Ctrl+Y)">
        <i class="fas fa-redo"></i>
      </button>

      <button id="menuBtn" class="tool-button" title="More Options" aria-label="Menu options">
        <i class="fas fa-bars"></i>
      </button>
      
      <!-- Dropdown Action Menu -->
      <div id="menu-popup" role="menu">
        <button class="menu-item" id="clearBtn" role="menuitem">
          <i class="fas fa-trash-alt"></i> Clear Canvas
        </button>
        <button class="menu-item" id="saveBtn" role="menuitem">
          <i class="fas fa-download"></i> Save as PNG
        </button>
        <button class="menu-item" id="loadBtn" role="menuitem">
          <i class="fas fa-folder-open"></i> Load Image
        </button>
        <button class="menu-item danger" id="leaveBtn" role="menuitem">
          <i class="fas fa-sign-out-alt"></i> Leave Room
        </button>
      </div>
    </div>
    
    <!-- Real-time Presence & Room Info -->
    <div id="room-info">
      <span id="user-count">1 user</span>
      <span id="room-id" title="Room Code">Loading...</span>
      <button id="copy-room-id" title="Copy Room ID to clipboard">
        <i class="far fa-copy"></i> Copy
      </button>
    </div>
  </div>

  <!-- Drawing Surface -->
  <canvas id="whiteboard"></canvas>

  <!-- Live Connection Indicator -->
  <div id="connection-status">Connecting...</div>

  <!-- Client Script -->
  <script src="js/room.js"></script>
</body>
</html>
