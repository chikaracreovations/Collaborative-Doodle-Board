<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Room | DoodleBoard</title>
  <meta name="description" content="Create a new collaborative whiteboard room with custom room IDs, password protection, and live multi-user drawing.">
  
  <!-- Fonts & Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Modular Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/forms.css">
</head>
<body>

  <!-- App Header -->
  <header class="app-header">
    <div class="header-content">
      <a href="index.html" class="back-btn" id="backBtn">
        <i class="fas fa-arrow-left"></i>
        <span>Home</span>
      </a>

      <a href="index.html" class="brand-link">
        <div class="logo">
          <i class="fas fa-paint-brush"></i>
          <span>DoodleBoard</span>
        </div>
      </a>

      <div style="width: 70px;"></div>
    </div>
  </header>

  <!-- Main Create Room Card -->
  <main class="form-main">
    <div class="form-card">
      <h1><i class="fas fa-plus-circle"></i> Create Room</h1>
      
      <div class="form-group">
        <label for="roomName">Room Name</label>
        <input type="text" id="roomName" placeholder="e.g. Brainstorming Session" required autofocus>
      </div>
      
      <div class="form-group">
        <label for="roomPassword">Password (optional)</label>
        <input type="password" id="roomPassword" placeholder="Set a room password">
      </div>
      
      <div class="form-group">
        <label for="userName">Your Display Name</label>
        <input type="text" id="userName" placeholder="How others will see you" required>
      </div>
      
      <div class="room-settings">
        <h3><i class="fas fa-sliders-h"></i> Room Options</h3>
        
        <div class="setting-option">
          <span>Allow guests to draw</span>
          <label class="switch">
            <input type="checkbox" checked>
            <span class="slider"></span>
          </label>
        </div>
        
        <div class="setting-option">
          <span>Require password</span>
          <label class="switch">
            <input type="checkbox">
            <span class="slider"></span>
          </label>
        </div>
        
        <div class="setting-option">
          <span>Enable live cursor broadcasting</span>
          <label class="switch">
            <input type="checkbox" checked>
            <span class="slider"></span>
          </label>
        </div>
      </div>
      
      <button class="btn btn-primary" id="createRoomBtn">
        <i class="fas fa-rocket"></i> Launch Canvas Room
      </button>
    </div>
  </main>

  <!-- App Footer -->
  <footer class="app-footer">
    <div class="footer-content">
      <div>&copy; <span id="current-year"></span> Chikara Creovations. All Rights Reserved.</div>
    </div>
  </footer>

  <!-- Client Script -->
  <script src="js/create-room.js"></script>
</body>
</html>
